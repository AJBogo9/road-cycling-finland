name: Build and deploy the map

on:
  push:
    branches: [main]
  schedule:
    # wednesdays 03:00 utc: midweek, so the station check sees a normal timetable
    - cron: "0 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Fetch, build and export
        run: |
          uv sync --frozen --no-dev
          uv run --no-sync roadcycling fetch
          uv run --no-sync roadcycling build
          uv run --no-sync roadcycling export
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
