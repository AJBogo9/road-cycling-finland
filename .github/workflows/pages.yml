name: Build and deploy the map

on:
  push:
    branches: [main]
  schedule:
    # wednesdays 03:00 utc: midweek, so the station check sees a normal timetable
    - cron: "0 3 * * 3"
  workflow_dispatch:

# read only by default; only the deploy job may write to pages
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions pinned to commit hashes; the comment names the release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Fetch, build and export
        run: |
          uv sync --frozen --no-dev
          uv run --no-sync roadcycling fetch
          uv run --no-sync roadcycling build
          uv run --no-sync roadcycling export
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
