[project]
name = "roadcycling"
version = "0.1.0"
description = "Score Finnish state roads for road cycling from open Väylävirasto data"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["geopandas>=1.1", "shapely>=2.1", "pyogrio>=0.11", "requests>=2.32"]

[project.scripts]
roadcycling = "roadcycling.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15", "matplotlib>=3.10", "ipykernel>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-m 'not network'"
markers = ["network: talks to the live Väylävirasto, Digitraffic and HSL servers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
