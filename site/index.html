<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Road cycling Uusimaa</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.12.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map" role="region" aria-label="Map of scored roads"></div>
  <aside id="panel">
    <h1>Quiet roads near a station</h1>
    <p id="summary">Loading the road data.</p>
    <label class="field" for="km">Within <output id="km-out" for="km"></output> km of a rail or metro station</label>
    <input id="km" type="range" min="1" max="40" step="1">
    <label class="check"><input id="show-fail" type="checkbox"> Show roads that fail a filter</label>
    <div class="legend" aria-hidden="true">
      <div class="bar"></div>
      <div class="ticks"><span id="score-floor"></span><span>score</span><span>100</span></div>
    </div>
    <p class="rule" id="rule"></p>
    <footer>
      Road data from <a href="https://vayla.fi/en/transport-network/data/open-data">Väylävirasto</a>,
      stations from <a href="https://www.digitraffic.fi/en/">Fintraffic Digitraffic</a> and
      <a href="https://www.hsl.fi/en">HSL</a>, all under
      <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>. This map combines and
      scores their data. Data fetched <span id="fetched"></span>.
      <a href="https://github.com/AJBogo9/road-cycling-finland">Source code</a>.
    </footer>
  </aside>
  <script type="module" src="app.js"></script>
</body>
</html>
